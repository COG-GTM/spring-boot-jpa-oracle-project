spring.main.banner-mode=off

#server
#server.error.whitelabel.enabled=false

# create and drop tables and sequences
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Oracle settings
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=carsystem
spring.datasource.password=carsystem
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate auto-selects OracleDialect from the JDBC metadata; do not set it explicitly
spring.jpa.open-in-view=false

# HikariCP settings
# spring.datasource.hikari.*

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
# avoids ORA-01882 "timezone region not found" with ojdbc11
spring.datasource.hikari.data-source-properties.oracle.jdbc.timezoneAsRegion=false

# logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.org.hibernate.SQL=debug
#logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.root=info
