# Test-only profile: runs the app against in-memory H2 instead of Oracle.
# Never active in production; the Oracle settings in src/main/resources are untouched.
spring.datasource.url=jdbc:h2:mem:cardb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
